version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: garmin_coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://coach:coach@db:5432/garmin_coach
    ports:
      - "8000:8000"
    depends_on:
      - db

  sync:
    build: ./backend
    command: python -m app.run_sync
    environment:
      DATABASE_URL: postgresql+psycopg2://coach:coach@db:5432/garmin_coach
      # Personal Garmin Connect account (default). Set these in a .env file.
      GARMIN_SOURCE: ${GARMIN_SOURCE:-connect}
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      GARMIN_TOKENSTORE: /secrets/.garminconnect
      # Used only when GARMIN_SOURCE=health
      GARMIN_TOKEN_FILE: /secrets/garmin_token.json
    volumes:
      - ./secrets:/secrets
    restart: always
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
